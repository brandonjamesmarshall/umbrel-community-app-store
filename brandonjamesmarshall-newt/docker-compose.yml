version: "3.7"

# Newt is a background WireGuard tunnel client — no web UI, so no app_proxy.
#
# Credentials live in ${APP_DATA_DIR}/.env on your Umbrel, loaded via the
# env_file directive below. Pre-create the .env before installing — see
# .env.example for the required keys. The .env stays on your Umbrel only
# and is never committed to the public repo.

services:

  newt:
    # Pinned to immutable digest — refresh in a reviewed commit, never auto-update.
    image: fosrl/newt:1.16.0@sha256:345fdeb369be6608d82c41d70637636c78b2c04a6112ff6ec20fc21c48afc899
    restart: unless-stopped
    env_file:
      # Long-form with required:false so a missing/misplaced .env doesn't
      # wedge an update at 99% — the container still starts (newt just won't
      # connect until the .env is present). Needs Compose >= v2.24.
      - path: ${APP_DATA_DIR}/.env
        required: false
