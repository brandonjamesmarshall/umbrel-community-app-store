version: "3.7"

# Newt is a background WireGuard tunnel client — no web UI, so no app_proxy.
#
# Secrets (PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET) are loaded from
# ${APP_DATA_DIR}/newt.env, which lives only on this Umbrel and is
# never committed to the app store repo. See umbrel-app.yml for setup steps.

services:

  newt:
    # Pinned to immutable digest — refresh in a reviewed commit, never auto-update.
    image: fosrl/newt:1.12.5@sha256:3c009663332145cae39b940b07857469038d5e9d71aacb1497e78795ba4e3b9b
    restart: unless-stopped
    env_file:
      # Optional so the app installs cleanly before you've dropped creds.
      # Until newt.env exists, the container will restart-loop (failing to
      # auth) — expected and harmless. Drop the file and umbrelOS will
      # show it as healthy.
      - path: ${APP_DATA_DIR}/newt.env
        required: false
