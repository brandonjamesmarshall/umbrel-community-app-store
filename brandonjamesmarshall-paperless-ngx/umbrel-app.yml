manifestVersion: 1
id: brandonjamesmarshall-paperless-ngx
name: Paperless-ngx
tagline: Scan, OCR and search every document you own
icon: https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/paperless-ngx.png
category: Files
# renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
version: "3.1.3"
port: 8000
description: >-
  Paperless-ngx turns a pile of scans into a searchable archive. Drop a PDF or
  an image into the consume folder and it OCRs the text, guesses the
  correspondent, document type and tags from what it has learned so far, files
  the original away untouched, and makes every word full-text searchable.


  This build runs the full Postgres stack (webserver + Postgres + Valkey).
  The database and search index live on the Umbrel's SSD, where they belong;
  the scanner dropbox, the document archive and the exports all live in one
  NAS share over NFS, so every actual file is browsable and backed up without
  Paperless in the loop.


  Like this store's other apps it also listens on a DIRECT port (18000) that
  bypasses the umbrelOS login gateway, so the Paperless mobile app, a
  network scanner posting to the API, and anyone you share it with through
  Pangolin can reach it. Paperless's own login is the gate on that port.


  BEFORE INSTALLING — on the NAS, create the Inbox, Documents and Export
  folders in the share and put a file in each (an empty NFS folder makes the
  install hang at 1%), and give the share an NFS permission rule for the
  Umbrel's IP. The paths are at the bottom of this app's docker-compose.yml.


  FIRST LOGIN: Paperless ships with no default account. Either import your
  existing install (below), which brings your users and passwords across, or
  create one over SSH:

  docker exec -it brandonjamesmarshall-paperless-ngx_webserver_1 python3
  manage.py createsuperuser


  MIGRATING AN EXISTING PAPERLESS: use Paperless's own exporter, not a file
  copy — it is version- and database-agnostic, so SQLite to Postgres is fine.
  On the old machine run document_exporter, move the export into the share's
  Export folder, then run document_importer here. Step-by-step commands are
  in the README:
  https://github.com/brandonjamesmarshall/umbrel-community-app-store/tree/master/brandonjamesmarshall-paperless-ngx


  OPTIONAL CONFIG: create app-data/brandonjamesmarshall-paperless-ngx/.env to
  set PAPERLESS_URL (your Pangolin domain — needed for CSRF once you expose
  it), PAPERLESS_TIME_ZONE and PAPERLESS_OCR_LANGUAGE, then Stop/Start the
  app.
