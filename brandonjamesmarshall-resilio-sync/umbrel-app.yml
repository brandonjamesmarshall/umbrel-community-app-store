manifestVersion: 1
id: brandonjamesmarshall-resilio-sync
name: Resilio Sync
tagline: Peer-to-peer file synchronization
icon: https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/resilio-sync.svg
category: Files
# renovate: datasource=docker depName=linuxserver/resilio-sync
version: "3.1.2+dh2"
port: 8888
description: >-
  Resilio Sync (formerly BitTorrent Sync) uses the BitTorrent protocol to sync
  files and folders between all of your devices, both over local network and
  the internet.


  This packaging uses the linuxserver/resilio-sync image. After install, open
  the web UI to create an identity, then add folders to sync. Data is stored
  under the app's data directory on your Umbrel.


  Default ports:

  - 8888  Web UI

  - 55555 Sync listening port (TCP/UDP)


  BACKUPS: Umbrel backups keep the Resilio config (identity, keys, folder
  list) but skip the synced folders themselves, on the assumption that
  another peer holds and backs up the same data. After a restore, the
  folders come back empty and Resilio reports them missing; re-add or
  re-point them so they pull back down from a peer. Each folder's
  .sync/Archive (local copies of files other peers changed or deleted)
  is also skipped, so that version history is not restored.
developer: Resilio, Inc.
website: https://www.resilio.com/individuals/
submitter: brandonjamesmarshall
submission: https://github.com/brandonjamesmarshall/umbrel-community-app-store
repo: https://github.com/linuxserver/docker-resilio-sync
support: https://github.com/linuxserver/docker-resilio-sync/issues
gallery:
  - https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/resilio-sync.svg
releaseNotes: >-
  Auto-updated to the latest LinuxServer Resilio Sync release. See what changed:
  https://github.com/linuxserver/docker-resilio-sync/releases
dependencies: []
backupIgnore:
  - data/sync/*
path: ""
defaultUsername: ""
defaultPassword: ""
