version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: brandonjamesmarshall-resilio-sync_server_1
      APP_PORT: 8888

  server:
    # Pinned to immutable digest — refresh in a reviewed commit, never auto-update.
    image: linuxserver/resilio-sync:3.1.2@sha256:04c1b89e139c9486c0311c573cb6db2e386ba7fe19c0e22df1c2e77c37667da3
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/downloads
      - ${APP_DATA_DIR}/data/sync:/sync
    ports:
      - "55555:55555/tcp"
      - "55555:55555/udp"
