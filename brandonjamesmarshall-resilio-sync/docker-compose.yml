version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: brandonjamesmarshall-resilio-sync_server_1
      APP_PORT: 8888

  server:
    # Pinned to immutable digest — refresh in a reviewed commit, never auto-update.
    image: linuxserver/resilio-sync:3.1.2@sha256:d39856fc6fc05a7b3c75a4c137b90027606ce8a216f0f021de2bd3462222e0e8
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/downloads
      - ${APP_DATA_DIR}/data/sync:/sync
    ports:
      - "55555:55555/tcp"
      - "55555:55555/udp"
