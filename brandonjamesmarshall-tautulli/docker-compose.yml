version: "3.7"

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-tautulli_server_1
      APP_PORT: 8181

  server:
    image: lscr.io/linuxserver/tautulli:2.17.1@sha256:97a8127cfd3be10f653cea347cef64098243e315c2d81385813b7d8fc6fc384b
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
