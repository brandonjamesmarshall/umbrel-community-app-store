version: "3.7"

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-tautulli_server_1
      APP_PORT: 8181
      # Whitelist Tautulli's API path so external API clients can hit it
      # with the Tautulli API key directly, bypassing umbrelOS session auth.
      PROXY_AUTH_WHITELIST: /api/v2,/api,/newsletter

  server:
    image: linuxserver/tautulli:2.18.1@sha256:c66d3afa8f7a701a48dd1b1f57b22eca0483d895d670fe11ecff783f6a9bbd73
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    # Tautulli has its own login + API key — keep both required.
    ports:
      - "18181:8181"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
