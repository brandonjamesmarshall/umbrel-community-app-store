manifestVersion: 1
id: brandonjamesmarshall-tautulli
name: Tautulli
tagline: Plex stats, history, and notifications
icon: https://getumbrel.github.io/umbrel-apps-gallery/tautulli/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/tautulli
version: "2.17.1+wl1"
port: 8181
description: >-
  Tautulli is a Plex Media Server companion that tracks usage statistics,
  watch history, and can send notifications on playback or library events.


  POST-INSTALL:

  1. Open Tautulli, complete the setup wizard.

  2. When asked for Plex Media Server, enter
     http://brandonjamesmarshall-plex_server_1:32400 (or the host LAN IP
     if Plex is in host network mode) and the Plex token Tautulli will
     fetch for you after sign-in.
developer: Tautulli developers
