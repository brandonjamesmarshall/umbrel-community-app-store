id: brandonjamesmarshall-buzz
name: Buzz
tagline: Self-hosted Buzz relay — humans and AI agents in one workspace
icon: https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/buzz.svg
category: Social
# Semver base + the bump workflow's +revN suffix on compose (digest) changes,
# matching the store's other rolling-tag apps. (The store listing tolerates
# non-semver strings — verified 2026-07-30 — but update comparison is safest
# on semver.) Upstream has no releases; base = the buzz workspace version.
# Image digest resolved 2026-07-30.
version: "0.1.0+rev15"
port: 3777
description: >-
  Buzz (by Block) is an open-source workspace where humans and AI agents
  collaborate as first-class members — channels, threads, DMs, git, and
  workflows on the Nostr protocol. This app runs the full self-hosted relay
  stack: the Buzz relay plus its Postgres, Redis, and MinIO dependencies, all
  stored under this app's data directory so umbrelOS backups cover the
  workspace history and audit chain.


  There is no web UI — the relay speaks WebSocket + REST on port 3777, and you
  connect with the Buzz desktop/mobile clients (buzz.xyz). Expose the port via
  a Pangolin resource (WebSocket support on) and point clients at
  wss://your-domain.


  SETUP — just click Install. The first start generates a config file with
  fresh secrets at app-data/brandonjamesmarshall-buzz/.env, and the relay
  waits (restarting, always CLOSED — the auth policy is hardcoded in the app
  and cannot start open) until you fill in the two values only you know:


  1. SSH into your Umbrel and edit the file with nano: it lives under
  umbrel/app-data/brandonjamesmarshall-buzz/.env in your home directory.


  2. Set RELAY_OWNER_PUBKEY to your Nostr pubkey (64-char hex, not npub), and
  replace CHANGE_ME.example.com with your Pangolin domain everywhere (in
  nano, Ctrl+\ replaces all).


  3. Stop and Start the app in umbrelOS, then verify:
  curl http://umbrel.local:3777/_liveness


  A copy-pasteable version of these steps (and the Pangolin resource setup)
  is in this app's README:
  https://github.com/brandonjamesmarshall/umbrel-community-app-store/tree/master/brandonjamesmarshall-buzz
developer: Block, Inc.
website: https://buzz.xyz
submitter: brandonjamesmarshall
submission: https://github.com/brandonjamesmarshall/umbrel-community-app-store
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues
gallery:
  - https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/buzz.svg
releaseNotes: >-
  Adds the NIP-AB device-pairing sidecar (buzz-pair-relay, host port 3778) so
  the Buzz mobile app can pair by QR. Fresh installs get a
  BUZZ_PAIRING_RELAY_URL template line in .env; existing installs add it by
  hand and point a second Pangolin resource at 3778 — see the README's
  "Mobile pairing" section.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
