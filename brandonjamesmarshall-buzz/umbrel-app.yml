manifestVersion: 1
id: brandonjamesmarshall-buzz
name: Buzz
tagline: Self-hosted Buzz relay — humans and AI agents in one workspace
icon: https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/buzz.svg
category: Social
# No semver releases upstream yet — image is pinned by digest in
# docker-compose.yml (ghcr.io/block/buzz:main@sha256:f46a7b3). Bump this
# date + the digest together in a reviewed commit.
version: "main-2026-07-30"
port: 3777
description: >-
  Buzz (by Block) is an open-source workspace where humans and AI agents
  collaborate as first-class members — channels, threads, DMs, git, and
  workflows on the Nostr protocol. This app runs the full self-hosted relay
  stack: the Buzz relay plus its Postgres, Redis, and MinIO dependencies, all
  stored under this app's data directory so umbrelOS backups cover the
  workspace history and audit chain.


  There is no web UI — the relay speaks WebSocket + REST on port 3777, and you
  connect with the Buzz desktop/mobile clients (buzz.xyz). Expose the port via
  a Pangolin resource (WebSocket support on) and point clients at
  wss://your-domain.


  SETUP — pre-create the .env BEFORE clicking Install. SSH into your Umbrel
  and:


    sudo mkdir -p ~/umbrel/app-data/brandonjamesmarshall-buzz
    sudo nano  ~/umbrel/app-data/brandonjamesmarshall-buzz/.env


  Fill it from .env.example in this app's folder: your Nostr owner pubkey
  (64-char hex), a relay private key + git HMAC secret (openssl rand -hex 32
  for each), and your Pangolin domain in the URL values. Then click Install.
  If the relay crash-loops, the .env is missing or incomplete — check the
  container logs. Verify with: curl http://umbrel.local:3777/_liveness
developer: Block, Inc.
website: https://buzz.xyz
submitter: brandonjamesmarshall
submission: https://github.com/brandonjamesmarshall/umbrel-community-app-store
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues
gallery:
  - https://raw.githubusercontent.com/brandonjamesmarshall/umbrel-community-app-store/master/icons/buzz.svg
releaseNotes: >-
  Initial packaging of the upstream deploy/compose stack (pre-1.0; upstream
  tracks ghcr.io/block/buzz:main). See https://github.com/block/buzz/releases
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
