version: "3.7"

# Buzz (github.com/block/buzz) — self-hosted relay stack: relay + Postgres +
# Redis + MinIO. Ported from upstream deploy/compose/compose.yml with two
# Umbrel-specific changes:
#
#   1. Internal infra secrets (Postgres/Redis/MinIO) are derived from Umbrel's
#      per-app ${APP_SEED} at compose time — they never leave the box and are
#      not user-facing. Upstream composes these from a .env next to the compose
#      file, which would live in this public repo; APP_SEED avoids that.
#   2. Named volumes are converted to ${APP_DATA_DIR} bind mounts so umbrelOS
#      backups cover the relay's Postgres (the workspace history + audit
#      chain), git data, and media.
#
# Identity + domain config (relay keypair, owner pubkey, Pangolin domain URLs)
# is user-specific and lives in ${APP_DATA_DIR}/.env. The env-init service
# GENERATES it on first start (secrets auto-minted; two CHANGE_ME values left
# for the user — the umbrelOS store description isn't copy-pasteable, so setup
# must not depend on pasting commands). Until the CHANGE_ME values are filled
# and the app is stopped/started, the relay crash-loops CLOSED — never open:
# Buzz's code defaults auth/membership enforcement OFF, so the closed-relay
# policy is hardcoded under environment: below, which takes precedence over
# env_file and cannot be weakened from .env. env_file stays required:false
# because Compose resolves it at container-create time, before env-init has
# run on a fresh install; the policy hardcoding is what keeps that safe.
# Needs Compose >= v2.24 (long-form env_file), same as newt.

services:

  env-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "1000:1000"
    entrypoint: >
      /bin/sh -euc '
        if [ ! -f /appdata/.env ]; then
          RK=$(head -c32 /dev/urandom | od -An -tx1 | tr -d " \n");
          HM=$(head -c32 /dev/urandom | od -An -tx1 | tr -d " \n");
          umask 077;
          {
            echo "# Generated by the buzz app on first start.";
            echo "# 1. Set RELAY_OWNER_PUBKEY to YOUR Nostr pubkey (64-char hex, not npub).";
            echo "# 2. Replace CHANGE_ME.example.com with your Pangolin domain everywhere";
            echo "#    (nano: Ctrl+\\ replaces all).";
            echo "# 3. Stop and Start the app in umbrelOS.";
            echo "# Secrets below were auto-generated — leave them alone and keep this file mode 600.";
            echo "";
            echo "RELAY_OWNER_PUBKEY=CHANGE_ME_YOUR_PUBKEY_64_HEX";
            echo "";
            echo "BUZZ_RELAY_PRIVATE_KEY=$$RK";
            echo "BUZZ_GIT_HOOK_HMAC_SECRET=$$HM";
            echo "";
            echo "BUZZ_DOMAIN=CHANGE_ME.example.com";
            echo "RELAY_URL=wss://CHANGE_ME.example.com";
            echo "BUZZ_MEDIA_BASE_URL=https://CHANGE_ME.example.com/media";
            echo "BUZZ_MEDIA_SERVER_DOMAIN=CHANGE_ME.example.com";
            echo "BUZZ_CORS_ORIGINS=https://CHANGE_ME.example.com";
            echo "";
            echo "BUZZ_GIT_CONFORMANCE_PROBE=true";
            echo "RUST_LOG=buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info";
          } > /appdata/.env;
          echo "env-init: wrote fresh /appdata/.env — fill the CHANGE_ME values, then Stop/Start the app.";
        else
          echo "env-init: .env already exists, leaving it untouched.";
        fi
      '
    volumes:
      - ${APP_DATA_DIR}:/appdata
    restart: "no"

  relay:
    # Tracks upstream's recommended pre-release tag, pinned to an immutable
    # digest (resolved 2026-07-30) — refresh in a reviewed commit. Upstream has
    # no semver release tags yet; switch to one when they exist.
    image: ghcr.io/block/buzz:main@sha256:f46a7b3c6eb5d0fe0e68e4622473512ae0abce61d7cc1e1757769ba40b94b7e3
    restart: unless-stopped
    env_file:
      - path: ${APP_DATA_DIR}/.env
        required: false
    environment:
      # Fail-closed relay policy — environment: overrides env_file, so these
      # are not configurable from .env (Buzz code defaults them to false).
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${APP_SEED}-pg@postgres:5432/buzz
      REDIS_URL: redis://:${APP_SEED}-redis@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz-media
      BUZZ_S3_SECRET_KEY: ${APP_SEED}-s3
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      # Opt-in upstream; enabled here so a fresh install migrates itself.
      BUZZ_AUTO_MIGRATE: "true"
    ports:
      - "3777:3000"
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
    depends_on:
      env-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no
    # curl/wget/socat (verbatim from upstream).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${APP_SEED}-pg
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    # Upstream interpolates the password into `command:` at compose time from
    # its local .env; here the shell expands it in-container from environment
    # so the secret stays out of this file.
    command:
      ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${APP_SEED}-redis
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz-media
      MINIO_ROOT_PASSWORD: ${APP_SEED}-s3
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: buzz-media
      BUZZ_S3_SECRET_KEY: ${APP_SEED}-s3
      BUZZ_S3_BUCKET: buzz-media
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: "no"
