version: "3.7"

# Buzz (github.com/block/buzz) — self-hosted relay stack: relay + Postgres +
# Redis + MinIO. Ported from upstream deploy/compose/compose.yml with three
# Umbrel-specific changes:
#
#   1. Internal infra secrets (Postgres/Redis/MinIO) are derived from Umbrel's
#      per-app ${APP_SEED} at compose time — they never leave the box and are
#      not user-facing. Upstream composes these from a .env next to the compose
#      file, which would live in this public repo; APP_SEED avoids that.
#   2. Named volumes are converted to ${APP_DATA_DIR} bind mounts so umbrelOS
#      backups cover the relay's Postgres (the workspace history + audit
#      chain), git data, and media.
#   3. A pg-migrate one-shot dump/restores the Postgres cluster across major
#      version bumps, since app updates ship unattended and a Postgres major
#      cannot start on the previous major's data dir (see its comment).
#
# Identity + domain config (relay keypair, owner pubkey, Pangolin domain URLs)
# is user-specific and lives in ${APP_DATA_DIR}/.env. The env-init service
# GENERATES it on first start (secrets auto-minted; two CHANGE_ME values left
# for the user — the umbrelOS store description isn't copy-pasteable, so setup
# must not depend on pasting commands). Until the CHANGE_ME values are filled
# and the app is stopped/started, the relay crash-loops CLOSED — never open:
# Buzz's code defaults auth/membership enforcement OFF, so the closed-relay
# policy is hardcoded under environment: below, which takes precedence over
# env_file and cannot be weakened from .env. env_file stays required:false
# because Compose resolves it at container-create time, before env-init has
# run on a fresh install; the policy hardcoding is what keeps that safe.
# Needs Compose >= v2.24 (long-form env_file), same as newt.

services:

  env-init:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    user: "1000:1000"
    entrypoint: >
      /bin/sh -euc '
        if [ ! -f /appdata/.env ]; then
          RK=$(head -c32 /dev/urandom | od -An -tx1 | tr -d " \n");
          HM=$(head -c32 /dev/urandom | od -An -tx1 | tr -d " \n");
          umask 077;
          {
            echo "# Generated by the buzz app on first start.";
            echo "# 1. Set RELAY_OWNER_PUBKEY to YOUR Nostr pubkey (64-char hex, not npub).";
            echo "# 2. Replace CHANGE_ME.example.com with your Pangolin domain everywhere";
            echo "#    (nano: Ctrl+\\ replaces all).";
            echo "# 3. Stop and Start the app in umbrelOS.";
            echo "# Secrets below were auto-generated — leave them alone and keep this file mode 600.";
            echo "";
            echo "RELAY_OWNER_PUBKEY=CHANGE_ME_YOUR_PUBKEY_64_HEX";
            echo "";
            echo "BUZZ_RELAY_PRIVATE_KEY=$$RK";
            echo "BUZZ_GIT_HOOK_HMAC_SECRET=$$HM";
            echo "";
            echo "# RELAY_URL is the community identity — changing it later seeds a";
            echo "# FRESH empty community and orphans the existing workspace data.";
            echo "BUZZ_DOMAIN=CHANGE_ME.example.com";
            echo "RELAY_URL=wss://CHANGE_ME.example.com";
            echo "BUZZ_MEDIA_BASE_URL=https://CHANGE_ME.example.com/media";
            echo "BUZZ_MEDIA_SERVER_DOMAIN=CHANGE_ME.example.com";
            echo "BUZZ_CORS_ORIGINS=https://CHANGE_ME.example.com";
            echo "";
            echo "# Mobile pairing (optional): advertised to the desktop via NIP-11.";
            echo "# Point a Pangolin resource (WebSocket on) at port 3778 first — see README.";
            echo "BUZZ_PAIRING_RELAY_URL=wss://pair.CHANGE_ME.example.com";
            echo "";
            echo "BUZZ_GIT_CONFORMANCE_PROBE=true";
            echo "RUST_LOG=buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info";
          } > /appdata/.env;
          echo "env-init: wrote fresh /appdata/.env — fill the CHANGE_ME values, then Stop/Start the app.";
        else
          echo "env-init: .env already exists, leaving it untouched.";
        fi
      '
    volumes:
      - ${APP_DATA_DIR}:/appdata
    restart: "no"

  relay:
    # Tracks upstream's recommended pre-release tag, pinned to an immutable
    # digest (resolved 2026-07-30) — refresh in a reviewed commit. Upstream has
    # no semver release tags yet; switch to one when they exist.
    image: ghcr.io/block/buzz:main@sha256:5290a17c172e8dcc67afe58450a2d5adef27f739d925a4afcbffbe9433345889
    restart: unless-stopped
    env_file:
      - path: ${APP_DATA_DIR}/.env
        required: false
    environment:
      # Fail-closed relay policy — environment: overrides env_file, so these
      # are not configurable from .env (Buzz code defaults them to false).
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${APP_SEED}-pg@postgres:5432/buzz
      REDIS_URL: redis://:${APP_SEED}-redis@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz-media
      BUZZ_S3_SECRET_KEY: ${APP_SEED}-s3
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      # Opt-in upstream; enabled here so a fresh install migrates itself.
      BUZZ_AUTO_MIGRATE: "true"
    ports:
      - "3777:3000"
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
    depends_on:
      env-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no
    # curl/wget/socat (verbatim from upstream).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # NIP-AB device-pairing sidecar — lets the Buzz mobile app pair by QR. The
  # main relay is membership-gated, so an unpaired phone can never reach it;
  # pairing instead runs on this dedicated open relay (same pinned image — the
  # binary ships in it, mirroring upstream's helm pairing-relay.yaml). It is a
  # deliberately public, unauthenticated endpoint whose PAYLOADS are opaque
  # (ephemeral NIP-44 ciphertext between throwaway session keys, no DB, no
  # state) — mem_limit bounds the blast radius of that exposure. The image
  # ENTRYPOINT is buzz-relay, so this must be an `entrypoint:` override —
  # `command:` would append the path as an argument to the MAIN relay (the
  # helm chart says `command:` because k8s command ≙ docker entrypoint).
  # The desktop discovers the sidecar via BUZZ_PAIRING_RELAY_URL in the
  # relay's NIP-11 (set in ${APP_DATA_DIR}/.env — see README "Mobile
  # pairing"); while unset, desktop pairing falls back to <relay>/pair and
  # fails 404, which is just "pairing not configured", not an error here.
  pairing:
    image: ghcr.io/block/buzz:main@sha256:5290a17c172e8dcc67afe58450a2d5adef27f739d925a4afcbffbe9433345889
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    mem_limit: 256m
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    ports:
      - "3778:5000"
    # TCP-connect probe via /dev/tcp — image has bash but no curl/wget (same
    # trick as the relay's healthcheck; the chart uses a tcpSocket probe).
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # One-shot Postgres major-version migration (17 -> 18). A Postgres major
  # cannot start on the previous major's data dir, and pg_upgrade needs both
  # majors' binaries in one image, so migration is dump/restore with only
  # official images: this service stays on the OLD major (17 — hence the
  # renovate.json rule exempting it from version bumps) and, when the old
  # cluster (pgdata) is present, boots it socket-only and pg_dumps the buzz DB
  # into the postgres-upgrade staging dir. That dir is the postgres service's
  # /docker-entrypoint-initdb.d, so 18's first init (fresh pgdata18) replays
  # the dump. The dump's LAST statement is a server-side COPY that writes a
  # sentinel file, so the sentinel exists iff the whole restore committed; on
  # the next start this service sees it and retires the old cluster to
  # pgdata-17-retired — a rollback artifact, deletable once the relay is
  # verified healthy. The old cluster is never modified before the restore
  # completes; a restore that died mid-init (pgdata18 present, no sentinel) is
  # wiped for a clean retry, and the sentinel gate means a fully-restored
  # cluster can never be wiped. Fresh installs and already-migrated starts are
  # no-ops. The .part rename makes staging atomic so a dump interrupted
  # mid-write is redone, never restored.
  pg-migrate:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    entrypoint: >
      /bin/sh -euc '
        D=/var/lib/postgresql/data;
        U=/upgrade;
        if [ -f "$$D/.pg18-restore-complete" ]; then
          echo "pg-migrate: restore into 18 is complete — retiring the old 17 cluster.";
          if [ -d "$$D/pgdata" ]; then mv "$$D/pgdata" "$$D/pgdata-17-retired"; fi;
          rm -f "$$U/01-restore.sql" "$$U/01-restore.sql.part" "$$D/.pg18-restore-complete";
          echo "pg-migrate: done — old cluster kept at pgdata-17-retired until you delete it."; exit 0;
        fi;
        if [ ! -f "$$D/pgdata/PG_VERSION" ]; then
          echo "pg-migrate: no old cluster present — nothing to migrate."; exit 0;
        fi;
        V=$$(cat "$$D/pgdata/PG_VERSION");
        if [ "$$V" != "17" ]; then
          echo "pg-migrate: pgdata is major $$V, expected 17 — refusing to touch it." >&2; exit 1;
        fi;
        if [ -f "$$U/01-restore.sql" ]; then
          if [ -d "$$D/pgdata18" ]; then
            echo "pg-migrate: last restore died mid-init — clearing pgdata18 for a clean retry.";
            rm -rf "$$D/pgdata18";
          fi;
          echo "pg-migrate: dump staged — postgres 18 restores it on this start."; exit 0;
        fi;
        if [ -d "$$D/pgdata18" ]; then
          echo "pg-migrate: pgdata18 exists but no dump is staged and the 17 cluster was never retired — refusing to guess." >&2; exit 1;
        fi;
        echo "pg-migrate: dumping the 17 cluster for restore into 18...";
        chown postgres:postgres "$$D" "$$U";
        gosu postgres pg_ctl -D "$$D/pgdata" -o "-c listen_addresses=" -t 300 -w start;
        gosu postgres pg_dump -U buzz -d buzz --clean --if-exists -f "$$U/01-restore.sql.part";
        gosu postgres pg_ctl -D "$$D/pgdata" -m fast -t 300 -w stop;
        printf "COPY (SELECT 1) TO \047%s\047;\n" /var/lib/postgresql/.pg18-restore-complete >> "$$U/01-restore.sql.part";
        mv "$$U/01-restore.sql.part" "$$U/01-restore.sql";
        echo "pg-migrate: dump staged.";
      '
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/data/postgres-upgrade:/upgrade
    restart: "no"

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${APP_SEED}-pg
      # 18 images moved their VOLUME up to /var/lib/postgresql (the bind below
      # covers it — mounting at .../data like 17 did would leave an orphaned
      # anonymous volume behind on every restart). The pre-migration 17
      # cluster sits beside this at .../pgdata until pg-migrate retires it.
      PGDATA: /var/lib/postgresql/pgdata18
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
      - ${APP_DATA_DIR}/data/postgres-upgrade:/docker-entrypoint-initdb.d
    depends_on:
      pg-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      # 5 min unhealthy budget: the first start after a major bump replays the
      # pg-migrate dump during init, before the server accepts TCP.
      retries: 60
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    # Upstream interpolates the password into `command:` at compose time from
    # its local .env; here the shell expands it in-container from environment
    # so the secret stays out of this file.
    command:
      ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${APP_SEED}-redis
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz-media
      MINIO_ROOT_PASSWORD: ${APP_SEED}-s3
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: buzz-media
      BUZZ_S3_SECRET_KEY: ${APP_SEED}-s3
      BUZZ_S3_BUCKET: buzz-media
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: "no"
