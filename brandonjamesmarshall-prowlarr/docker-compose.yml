version: "3.7"

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-prowlarr_server_1
      APP_PORT: 9696
      # Whitelist API + indexer-feed paths so arrs and external indexer
      # clients can authenticate via API key, bypassing umbrelOS session login.
      PROXY_AUTH_WHITELIST: /api,/signalr,/feed,/Content,/MediaCover,/initialize.json,/ping,/download,/dl,/t,/api/v1/indexer

  server:
    image: lscr.io/linuxserver/prowlarr:2.3.5@sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    # Keep Prowlarr's Settings -> General -> Authentication enabled.
    ports:
      - "19696:9696"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
