version: "3.7"

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-prowlarr_server_1
      APP_PORT: 9696

  server:
    image: lscr.io/linuxserver/prowlarr:2.3.5@sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
