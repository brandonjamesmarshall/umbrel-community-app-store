description: >-
  Prowlarr is a unified indexer manager for Sonarr, Radarr, and other arr
  apps. Configure your trackers and Usenet indexers once here, then sync
  them to all arrs.


  POST-INSTALL:

  1. Open Prowlarr, complete first-run setup.

  2. Indexers -> add your tracker/Usenet indexer accounts.

  3. Settings -> Apps -> add Sonarr (URL http://brandonjamesmarshall-sonarr_server_1:8989)
     and Radarr (URL http://brandonjamesmarshall-radarr_server_1:7878), paste
     their API keys (Settings -> General -> API Key inside each app).

  4. Indexers -> Sync App Indexers -> Prowlarr pushes everything.
