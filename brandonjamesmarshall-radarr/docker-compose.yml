version: "3.7"

# Media library mounted as a Docker-managed NFS volume — see nas.env.example.

services:

  app_proxy:
    environment:
      APP_HOST: brandonjamesmarshall-radarr_server_1
      APP_PORT: 7878

  server:
    image: lscr.io/linuxserver/radarr:6.1.1@sha256:079e48870584baf2a3e7e43e7ba6d3c834555931851a59c82c51cc792d285caf
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/data

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST},nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
