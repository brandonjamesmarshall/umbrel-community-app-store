version: "3.7"

# Media library: Docker-managed NFS volume backed by the Synology share.
# Mounted twice — whole share at /media, "Download" subpath at /Download —
# both views of the same volume so hardlinks across them work (same st_dev).
# Matches the migrated Radarr DB's /media/Movies root + /Download/movies paths.

services:

  app_proxy:
    environment:
      # Use service-name DNS instead of full container name to avoid
      # underscore-vs-hyphen breakage between compose v1 and v2.
      APP_HOST: server
      APP_PORT: 7878

  server:
    image: lscr.io/linuxserver/radarr:6.1.1@sha256:079e48870584baf2a3e7e43e7ba6d3c834555931851a59c82c51cc792d285caf
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - type: volume
        source: media
        target: /media
      - type: volume
        source: media
        target: /Download
        volume:
          subpath: Download

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
