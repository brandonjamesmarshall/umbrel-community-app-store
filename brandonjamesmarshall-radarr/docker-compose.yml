version: "3.7"

# Media library: Docker-managed NFS volume backed by the Synology share,
# mounted at /media. Radarr's DB references /media/Movies (works as-is)
# and /Download/<category> (legacy paths from the NAS install — handled
# via Settings -> Download Clients -> Remote Path Mappings in the UI,
# where you map /Download -> /media/Download so imports of new downloads
# translate cleanly).

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-radarr_server_1
      APP_PORT: 7878

  server:
    image: lscr.io/linuxserver/radarr:6.1.1@sha256:079e48870584baf2a3e7e43e7ba6d3c834555931851a59c82c51cc792d285caf
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
