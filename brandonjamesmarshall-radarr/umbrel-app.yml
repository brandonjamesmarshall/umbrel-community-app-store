manifestVersion: 1
id: brandonjamesmarshall-radarr
name: Radarr
tagline: Movie collection manager
icon: https://getumbrel.github.io/umbrel-apps-gallery/radarr/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/radarr
version: "6.1.1"
port: 7878
description: >-
  Radarr automatically finds, downloads, and organises movies. Packaged for
  this community store with a shared /data NFS mount so imports hardlink
  instead of copying.


  Requires the Synology NFS share mounted at /mnt/plex-media on your
  Umbrel host (see store README for the one-time fstab setup).


  POST-INSTALL:

  1. Open Radarr, complete first-run setup.

  2. Settings -> Media Management -> Root Folders -> add /data/Movies.

  3. Settings -> Download Clients -> add Transmission
     (host: brandonjamesmarshall-transmission_gluetun_1, port 9091, category movies)
     and/or SABnzbd
     (host: brandonjamesmarshall-sabnzbd_server_1, port 8080, category movies).

  4. Settings -> Indexers -> add via Prowlarr's "Apps" page (recommended).
developer: Team Radarr
website: https://radarr.video
