manifestVersion: 1
id: brandonjamesmarshall-sonarr
name: Sonarr
tagline: TV show collection manager
icon: https://getumbrel.github.io/umbrel-apps-gallery/sonarr/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/sonarr
version: "4.0.19+nfs7"
port: 8989
description: >-
  Sonarr automatically finds, downloads, and organises TV shows. Packaged for
  this community store with a shared /data NFS mount so imports hardlink
  instead of copying.


  Media library and downloads are mounted via a Docker-managed NFS
  volume pointing at the NAS share — no host fstab needed.


  POST-INSTALL (only if starting fresh; skip if migrating from a NAS):

  1. Open Sonarr, complete first-run setup.

  2. Settings -> Media Management -> Root Folders -> add /media/TV.

  3. Settings -> Download Clients -> add Transmission
     (host: brandonjamesmarshall-transmission_gluetun_1, port 9091,
      Directory: /Download/tv, category: tv)
     and/or SABnzbd
     (host: brandonjamesmarshall-sabnzbd_server_1, port 8080, category: tv).
     Get the API key from each app's UI.

  4. Settings -> Indexers -> add via Prowlarr's "Apps" page (recommended)
     or manually.
developer: Team Sonarr
