version: "3.7"

# Media library: Docker-managed NFS volume backed by the Synology share,
# mounted at /media. Sonarr's DB references /media/TV (works as-is) and
# /Download/<category> (legacy paths from the NAS install — handled via
# Settings -> Download Clients -> Remote Path Mappings in the UI, where
# you map /Download -> /media/Download so imports of new downloads
# translate cleanly).

services:

  app_proxy:
    environment:
      # Use service-name DNS instead of full container name to avoid
      # underscore-vs-hyphen breakage between compose v1 and v2.
      APP_HOST: server
      APP_PORT: 8989

  server:
    image: lscr.io/linuxserver/sonarr:4.0.17@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
