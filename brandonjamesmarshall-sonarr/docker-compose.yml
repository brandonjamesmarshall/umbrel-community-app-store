version: "3.7"

# Media library: Docker-managed NFS volume backed by the Synology share,
# mounted at /media. Sonarr's DB references /media/TV (works as-is) and
# /Download/<category> (legacy paths from the NAS install — handled via
# Settings -> Download Clients -> Remote Path Mappings in the UI, where
# you map /Download -> /media/Download so imports of new downloads
# translate cleanly).

services:

  app_proxy:
    environment:
      # Full container name (underscore convention — umbrelOS forces compose v1
      # naming via COMPOSE_COMPATIBILITY). Using the bare service name "server"
      # collides with the same alias from other apps on the shared umbrel
      # network, causing DNS round-robin to send requests to wrong containers.
      APP_HOST: brandonjamesmarshall-sonarr_server_1
      APP_PORT: 8989
      # Whitelist API + push paths so mobile apps (Helmarr et al.) and other
      # arrs can hit Sonarr's API key auth directly, without bouncing off
      # umbrelOS's session login redirect at :2000.
      PROXY_AUTH_WHITELIST: /api,/signalr,/feed,/Content,/MediaCover,/initialize.json,/ping

  server:
    image: linuxserver/sonarr:4.0.19@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    # Direct port for mobile/API clients (e.g. Helmarr). Bypasses umbrelOS's
    # outer auth gateway on :8989, so app-level auth (Sonarr's API key + login)
    # is the only protection — keep Settings -> General -> Authentication on.
    ports:
      - "18989:8989"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
