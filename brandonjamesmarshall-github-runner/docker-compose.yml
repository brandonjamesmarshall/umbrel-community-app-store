version: "3.7"

# Self-hosted GitHub Actions runner — GitHub's OFFICIAL runner image
# (ghcr.io/actions/actions-runner, built from github.com/actions/runner).
# The image ships the runner + docker CLI/buildx + curl/jq but no
# entrypoint: registration is our job, done in the inline script below so
# the whole supply chain is GitHub's image + auditable lines in this file.
# No web UI, so no app_proxy.
#
# The Docker socket is mounted so workflow jobs can use service containers
# (e.g. CI Postgres) and container actions. That is root-equivalent access
# to this Umbrel — only register this runner against orgs whose workflows
# you fully trust.
#
# Credentials live in ${APP_DATA_DIR}/.env on your Umbrel, loaded via the
# env_file directive below. Pre-create the .env before installing — see
# .env.example for the required keys. The .env stays on your Umbrel only
# and is never committed to the public repo.

services:

  runner:
    # Pinned to immutable digest — refresh in a reviewed commit, never auto-update.
    image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
    restart: unless-stopped
    # Root for host-docker-socket access and for writing the bind-mounted
    # workdir; config.sh gates root behind RUNNER_ALLOW_RUNASROOT below.
    user: "0:0"
    environment:
      RUNNER_ALLOW_RUNASROOT: "1"
      # Docker-in-docker quirk: jobs that spin up containers via the host
      # socket pass host-side paths, so the workdir must be bind-mounted at
      # the IDENTICAL absolute path on host and in the container (see the
      # volumes below). Keep this in compose — .env authors can't know the
      # APP_DATA_DIR path.
      RUNNER_WORKDIR: ${APP_DATA_DIR}/work
      # Runner self-update stays ON (no --disableupdate): GitHub refuses
      # jobs from runners that fall behind the minimum version, and
      # Renovate's 14-day quarantine can lag a mandatory bump. The
      # in-container update is discarded on recreate and simply re-applies
      # — the image stays pinned.
    env_file:
      # Long-form with required:false so a missing/misplaced .env doesn't
      # wedge an update at 99% — the container still starts (the script
      # below just idles until the .env is present). Needs Compose >= v2.24.
      - path: ${APP_DATA_DIR}/.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path both sides — see RUNNER_WORKDIR note above.
      - ${APP_DATA_DIR}/work:${APP_DATA_DIR}/work
    entrypoint: ["/bin/bash", "-c"]
    # $$ is compose-escaping for a literal $ — every $$VAR below is a
    # container-side shell expansion, not compose interpolation.
    command:
      - |
        set -euo pipefail
        cd /home/runner
        if [ -z "$${ACCESS_TOKEN:-}" ] || [ -z "$${ORG_NAME:-}" ]; then
          echo "github-runner: ACCESS_TOKEN / ORG_NAME not set — create the app-data .env (see .env.example), then restart the app. Idling."
          exec sleep infinity
        fi
        gh_api() {
          curl -sf -X POST -H "Authorization: Bearer $${ACCESS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/$${ORG_NAME}/actions/runners/$$1" | jq -r .token
        }
        if [ ! -e .runner ]; then
          echo "github-runner: registering against https://github.com/$${ORG_NAME}"
          ./config.sh --unattended --replace \
            --url "https://github.com/$${ORG_NAME}" \
            --token "$$(gh_api registration-token)" \
            --name "$${RUNNER_NAME:-umbrel-runner}" \
            --labels "$${LABELS:-umbrel}" \
            --work "$$RUNNER_WORKDIR"
        fi
        deregister() {
          [ -e .runner ] || return 0
          echo "github-runner: deregistering"
          ./config.sh remove --token "$$(gh_api remove-token)" || true
        }
        # docker stop signals only PID 1 (this bash): forward TERM/INT to
        # the runner, then deregister once it's down. config.sh remove
        # deletes .runner, so the EXIT-trap backup call is a no-op.
        trap 'kill "$$RUNNER_PID" 2>/dev/null || true' TERM INT
        trap deregister EXIT
        ./run.sh & RUNNER_PID=$$!
        wait "$$RUNNER_PID" || true
        deregister
