manifestVersion: 1
id: brandonjamesmarshall-sabnzbd
name: SABnzbd
tagline: Binary newsreader for Usenet
icon: https://getumbrel.github.io/umbrel-apps-gallery/sabnzbd/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/sabnzbd
version: "5.0.3+nfs3"
port: 8080
description: >-
  SABnzbd is a Usenet (NZB) download client. Mounts the Synology share
  at /media via a Docker-managed NFS volume — no host fstab needed,
  survives umbrelOS reboots and firmware updates.


  POST-INSTALL:

  1. Open SABnzbd, complete first-run wizard (paste your Usenet provider
     credentials).

  2. Config -> Folders ->
       - Temporary Download Folder: /media/Download/sabnzbd/incomplete
       - Completed Download Folder: /media/Download/sabnzbd

  3. Config -> Categories ->
       - tv     -> /media/Download/sabnzbd/tv
       - movies -> /media/Download/sabnzbd/movies

  4. Wire SABnzbd into Sonarr/Radarr in their respective Download Clients
     settings (host: brandonjamesmarshall-sabnzbd_server_1, port 8080).
developer: The SABnzbd Team
