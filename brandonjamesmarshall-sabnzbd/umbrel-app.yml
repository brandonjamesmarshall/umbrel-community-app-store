manifestVersion: 1
id: brandonjamesmarshall-sabnzbd
name: SABnzbd
tagline: Binary newsreader for Usenet
icon: https://getumbrel.github.io/umbrel-apps-gallery/sabnzbd/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/sabnzbd
version: "5.0.3"
port: 8080
description: >-
  SABnzbd is a Usenet (NZB) download client. Packaged with the shared /data
  NFS mount so completed files land where Sonarr/Radarr can hardlink them
  into the library.


  Requires the Synology NFS share mounted at /mnt/plex-media on your
  Umbrel host (see store README for the one-time fstab setup).


  POST-INSTALL:

  1. Open SABnzbd, complete first-run wizard (paste your Usenet provider
     credentials).

  2. Config -> Folders ->
       - Temporary Download Folder: /data/Download/incomplete
       - Completed Download Folder: /data/Download

  3. Config -> Categories ->
       - tv     -> /data/Download/tv
       - movies -> /data/Download/movies

  4. Wire SABnzbd into Sonarr/Radarr in their respective Download Clients
     settings (host: brandonjamesmarshall-sabnzbd_server_1, port 8080).
developer: The SABnzbd Team
