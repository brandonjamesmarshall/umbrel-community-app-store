version: "3.7"

# Media library: Docker-managed NFS volume backed by the Synology share.
# Mounted at /media so SAB can write completed downloads under
# /media/Download/sabnzbd/ where Sonarr/Radarr can hardlink-import.

services:

  app_proxy:
    environment:
      # Use service-name DNS instead of full container name to avoid
      # underscore-vs-hyphen breakage between compose v1 and v2.
      APP_HOST: server
      APP_PORT: 8080

  server:
    image: lscr.io/linuxserver/sabnzbd:5.0.3@sha256:6b392fce45ed587ba7213259fbce6f9f725b157b746b36ec53d3f08ee415602e
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
