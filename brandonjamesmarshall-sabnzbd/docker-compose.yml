version: "3.7"

# Media library: Docker-managed NFS volume backed by the NAS share.
# Mounted at /media so SAB can write completed downloads under
# /media/Download/sabnzbd/ where Sonarr/Radarr can hardlink-import.

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-sabnzbd_server_1
      APP_PORT: 8080
      # Whitelist API path so Sonarr/Radarr (and mobile clients) can talk to
      # SAB's API key auth without umbrelOS session redirect.
      PROXY_AUTH_WHITELIST: /api,/sabnzbd/api

  server:
    image: linuxserver/sabnzbd:5.1.2@sha256:64c4c2b6ed546237451cbfec33aa8bac1396865c1a266dd247c02b36ffe27c62
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    # Keep SAB's API key requirement on (Config -> General -> API Key).
    ports:
      - "18080:8080"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
