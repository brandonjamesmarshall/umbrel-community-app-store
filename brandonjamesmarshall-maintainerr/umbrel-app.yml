category: Media
# renovate: datasource=docker depName=jorenn92/maintainerr
version: "3.12.0+wl2"
port: 6246
description: >-
  Maintainerr lets you define rule-based collections in Plex (e.g. "movies
  unwatched for 90 days") and can automatically delete or hand them back to
  Radarr/Sonarr/Overseerr to remove from the library.


  POST-INSTALL:

  1. Open Maintainerr, complete first-run setup.

  2. Configure connections to:
       - Plex:    http://brandonjamesmarshall-plex_server_1:32400 + Plex token
       - Sonarr:  http://brandonjamesmarshall-sonarr_server_1:8989 + API key
       - Radarr:  http://brandonjamesmarshall-radarr_server_1:7878 + API key

  3. Build rules under Rules -> New rule -> pick a section and conditions.
