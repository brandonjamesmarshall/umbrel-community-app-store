version: "3.7"

services:

  app_proxy:
    environment:
      # Full container name (see Sonarr compose for why we can't use bare "server").
      APP_HOST: brandonjamesmarshall-maintainerr_server_1
      APP_PORT: 6246
      # Whitelist Maintainerr's API path for external clients.
      PROXY_AUTH_WHITELIST: /api

  server:
    image: jorenn92/maintainerr:3.20.1@sha256:ce7ff52afa146dfc05c2c2304df8141e0086f14a803bdbef0d870e5b914f0dee
    restart: on-failure
    user: "1000:1000"
    environment:
      TZ: "Etc/UTC"
      BASE_PATH: ""
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    ports:
      - "16246:6246"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/data
