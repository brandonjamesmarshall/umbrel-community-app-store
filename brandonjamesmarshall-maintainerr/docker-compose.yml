version: "3.7"

services:

  app_proxy:
    environment:
      # Use service-name DNS instead of full container name to avoid
      # underscore-vs-hyphen breakage between compose v1 and v2.
      APP_HOST: server
      APP_PORT: 6246

  server:
    image: jorenn92/maintainerr:3.12.0@sha256:8d52584d00c7e60177fd44ce84c54a448135b74998b5045c69cc957bbcfdcd44
    restart: on-failure
    user: "1000:1000"
    environment:
      TZ: "Etc/UTC"
      BASE_PATH: ""
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/data
