version: "3.7"

# Transmission shares gluetun's network namespace via network_mode:
# "service:gluetun". gluetun is the ONLY service with internet access, and
# it routes through the iVPN WireGuard tunnel. If the tunnel drops,
# Transmission has no network — kill-switch by construction.
#
# Media library: Docker-managed NFS volume backed by the Synology share,
# mounted at /media so Transmission can write into /media/Download/transmission/
# where Sonarr/Radarr can hardlink-import.
#
# iVPN credentials live in ${APP_DATA_DIR}/.env on your Umbrel — see
# .env.example. Pre-create the .env BEFORE installing.

services:

  app_proxy:
    environment:
      # When sharing a netns, the listening port is reached via the netns
      # owner — gluetun, not transmission. Full container name to avoid
      # cross-app alias collision on the shared umbrel network.
      APP_HOST: brandonjamesmarshall-transmission_gluetun_1
      APP_PORT: 9091
      # Whitelist Transmission's RPC endpoint so Sonarr/Radarr and mobile
      # clients can use the username/password auth Transmission already
      # enforces, without umbrelOS's session login getting in the way.
      PROXY_AUTH_WHITELIST: /transmission/rpc,/transmission/upload,/transmission/web

  gluetun:
    # renovate: datasource=docker depName=qmcgaw/gluetun
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    # Transmission shares this netns, so 9091 here = Transmission's RPC port.
    # Set Transmission's RPC username/password (Edit -> Preferences -> Remote)
    # since umbrelOS's session auth no longer gates this entry point.
    ports:
      - "19091:9091"
    env_file:
      - ${APP_DATA_DIR}/.env
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun

  server:
    image: lscr.io/linuxserver/transmission:4.1.1@sha256:7d1f96f26f433d5bfa518f6392021e17fc74a7eb0322190746981143644ce29e
    restart: on-failure
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      # RPC auth — applied on FIRST container creation only. After that, change
      # via Transmission UI (Edit -> Preferences) or settings.json directly;
      # changes persist across restarts because these env vars only initialize
      # settings.json when it doesn't already exist.
      USER: umbrel
      PASS: umbrelmedia
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
