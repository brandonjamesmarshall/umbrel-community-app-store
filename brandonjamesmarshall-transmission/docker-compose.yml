version: "3.7"

# Transmission shares gluetun's network namespace via network_mode:
# "service:gluetun". gluetun is the ONLY service with internet access, and
# it routes through the iVPN WireGuard tunnel. If the tunnel drops,
# Transmission has no network — kill-switch by construction.
#
# Media library: Docker-managed NFS volume backed by the Synology share,
# mounted at /media so Transmission can write into /media/Download/transmission/
# where Sonarr/Radarr can hardlink-import.
#
# iVPN credentials live in ${APP_DATA_DIR}/.env on your Umbrel — see
# .env.example. Pre-create the .env BEFORE installing.

services:

  app_proxy:
    environment:
      # When sharing a netns, the listening port is reached via the netns
      # owner — gluetun, not transmission. Full container name to avoid
      # cross-app alias collision on the shared umbrel network.
      APP_HOST: brandonjamesmarshall-transmission_gluetun_1
      APP_PORT: 9091
      # Whitelist Transmission's RPC endpoint so Sonarr/Radarr and mobile
      # clients can use the username/password auth Transmission already
      # enforces, without umbrelOS's session login getting in the way.
      PROXY_AUTH_WHITELIST: /transmission/rpc,/transmission/upload,/transmission/web

  gluetun:
    # renovate: datasource=docker depName=qmcgaw/gluetun
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Direct port for mobile/API clients — bypasses umbrelOS auth gateway.
    # Transmission shares this netns, so 9091 here = Transmission's RPC port.
    # Set Transmission's RPC username/password (Edit -> Preferences -> Remote)
    # since umbrelOS's session auth no longer gates this entry point.
    ports:
      - "19091:9091"
    env_file:
      # required:false so a missing/misplaced .env doesn't wedge an update
      # at 99%; the container starts and the error shows in logs instead.
      # The .env pins a CUSTOM WireGuard endpoint (VPN_SERVICE_PROVIDER=custom):
      # the live iVPN server IP + key are specified directly, so gluetun never
      # touches its (staleness-prone) baked-in server list. See .env.example.
      - path: ${APP_DATA_DIR}/.env
        required: false
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun

  server:
    image: lscr.io/linuxserver/transmission:4.1.2@sha256:9b229b05a4027a5548285f66b2ba4cbf12bdef83ddac97f726afa94fbae308c0
    restart: on-failure
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      # RPC credentials — ${APP_PASSWORD} is a per-install deterministic
      # password umbreld derives from the device's umbrel-seed via HMAC-SHA256
      # with identifier "app-<this-app-id>-seed-APP_PASSWORD". umbrel-app.yml
      # has deterministicPassword: true so the UI displays the SAME value the
      # container gets here, and the "Copy" button on the app card works.
      USER: admin
      PASS: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/media

  # Keeps the VPN exit IP authorized on a private tracker that offers a
  # "dynamic seedbox" API — an authenticated endpoint that re-authorizes
  # whatever source IP the call arrives from. Shares gluetun's netns so the
  # call leaves via the VPN tunnel (the tracker authorizes the source IP it
  # sees). Checks the live IP every 5 min and re-registers when it changes
  # (within the common 1-update-per-hour API limit) — VPN providers rotate
  # across servers AND ASNs, so the tracker
  # session MUST be a dynamic-seedbox session (IP-locked + dynamic-seedbox
  # permission), NOT ASN-locked, or rotations into another ASN get rejected.
  # Without this, announces fail with "Unrecognized host/passkey" on rotation.
  # SEEDBOX_UPDATE_URL + SEEDBOX_COOKIE come from .env; if blank/absent the
  # container exits 0 right away, so users without such a tracker are
  # unaffected.
  seedbox-refresh:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    restart: on-failure
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    env_file:
      # required:false so a missing/misplaced .env doesn't wedge an update
      # at 99%; the container starts and the error shows in logs instead.
      - path: ${APP_DATA_DIR}/.env
        required: false
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$SEEDBOX_UPDATE_URL" ] || [ -z "$$SEEDBOX_COOKIE" ]; then
          echo "[seedbox-refresh] SEEDBOX_UPDATE_URL and/or SEEDBOX_COOKIE not set; set them in .env and restart. Exiting."
          exit 0
        fi
        last_ip=""
        last_ok=0
        while true; do
          # The cheap public-IP probe (every 5 min) is used ONLY to detect a
          # change. We (re)register on first run, a detected change, or a 6h
          # heartbeat — but these APIs accept one update/HOUR, so never call
          # more often than that. Crucially, startup + heartbeat are NOT gated
          # on the probe: the endpoint authorizes whatever source IP the
          # tracker sees, so it keeps getting refreshed even if icanhazip is
          # unreachable. No -f / no 2>/dev/null on the update call, so curl
          # transport errors surface.
          ip=$$(curl -fsS --max-time 20 https://icanhazip.com 2>/dev/null | tr -d '[:space:]')
          now=$$(date +%s)
          since=$$((now - last_ok))
          changed=0
          [ -n "$$ip" ] && [ "$$ip" != "$$last_ip" ] && changed=1
          if [ "$$last_ok" -eq 0 ] || [ "$$changed" -eq 1 ] || [ "$$since" -ge 21600 ]; then
            if [ "$$last_ok" -eq 0 ] || [ "$$since" -ge 3600 ]; then
              # Success convention: a JSON body containing "Success":true
              resp=$$(curl -sS --max-time 20 -b "$$SEEDBOX_COOKIE" "$$SEEDBOX_UPDATE_URL")
              if echo "$$resp" | grep -qiE '"success"[[:space:]]*:[[:space:]]*true'; then
                last_ip="$${ip:-$$last_ip}"; last_ok="$$now"
                echo "[seedbox-refresh] ok -- $$resp"
              else
                echo "[seedbox-refresh] update FAILED -- $$resp"
              fi
            fi
          fi
          sleep 300
        done

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
