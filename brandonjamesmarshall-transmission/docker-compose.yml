version: "3.7"

# Transmission shares gluetun's network namespace via network_mode:
# "service:gluetun". gluetun is the ONLY service with internet access, and
# it routes through the iVPN WireGuard tunnel. If the tunnel drops,
# Transmission has no network — kill-switch by construction.
#
# All per-install config (NAS host for the media NFS mount, gluetun's VPN
# credentials) goes in ONE file at
# ~/umbrel/app-data/brandonjamesmarshall-transmission/.env on your Umbrel.
# docker-compose auto-loads it for ${VAR} interpolation; the file stays on
# your Umbrel and is never committed to this public repo.
#
# Until the .env is dropped, gluetun restart-loops (no VPN config) and the
# NFS mount fails — install still succeeds, just nothing runs healthy yet.

services:

  app_proxy:
    environment:
      # When sharing a netns, the listening port is reached via the netns
      # owner's container — gluetun, not transmission.
      APP_HOST: brandonjamesmarshall-transmission_gluetun_1
      APP_PORT: 9091

  gluetun:
    # renovate: datasource=docker depName=qmcgaw/gluetun
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-ivpn}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_CITIES: ${SERVER_CITIES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      LOG_LEVEL: ${VPN_LOG_LEVEL:-info}
      DOT_PROVIDERS: ${DOT_PROVIDERS:-cloudflare}
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun

  server:
    image: lscr.io/linuxserver/transmission:4.1.1@sha256:7d1f96f26f433d5bfa518f6392021e17fc74a7eb0322190746981143644ce29e
    restart: on-failure
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - media:/data

volumes:
  # Media library mounted as a Docker-managed NFS volume — see nas.env.example.
  # NAS_HOST is loaded from the same .env as the VPN creds above.
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST:-127.0.0.1},nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
