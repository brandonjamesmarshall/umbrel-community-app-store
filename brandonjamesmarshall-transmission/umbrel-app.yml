manifestVersion: 1
id: brandonjamesmarshall-transmission
name: Transmission (via iVPN)
tagline: Torrent client tunneled through iVPN
icon: https://getumbrel.github.io/umbrel-apps-gallery/transmission/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/transmission
# Suffix "+vpnN" is auto-bumped by .github/workflows/bump-transmission-on-sidecar.yml
# whenever the gluetun sidecar (or anything else in docker-compose.yml) updates,
# so umbrelOS shows "Update available" even when only the VPN sidecar changed.
version: "4.1.2+vpn17"
port: 9091
description: >-
  Transmission torrent client, forced through an iVPN WireGuard tunnel via
  gluetun with a built-in kill-switch. If the VPN drops, Transmission loses
  all network access.


  SETUP — pre-create the .env BEFORE clicking Install (otherwise gluetun
  can't start without a private key, and Transmission can't attach to
  gluetun's netns, which fails the whole install).

  1. Generate a WireGuard keypair locally and register the public key in
     your iVPN account area. iVPN returns your assigned tunnel address.

  2. On your Umbrel:
       sudo mkdir -p ~/umbrel/app-data/brandonjamesmarshall-transmission
       sudo nano  ~/umbrel/app-data/brandonjamesmarshall-transmission/.env
     Paste the values from .env.example in this app's folder.

  3. Click Install in umbrelOS.

  4. Verify the kill-switch — SSH the Umbrel and run:
       docker exec brandonjamesmarshall-transmission_gluetun_1 wget -qO- https://ifconfig.me
     The IP must be an iVPN IP, NOT your home IP.


  RPC AUTH: web UI defaults to user "umbrel" / password "umbrelmedia"
  on first install. Change in Edit -> Preferences in the web UI or by
  editing settings.json in the app data dir, then restart. Use these
  credentials in Sonarr/Radarr's Download Client config too.


  5. In the Transmission UI -> Settings, set Default Download Directory:
       /media/Download/transmission
     (matches where Sonarr/Radarr will look for completed torrents.)


  Credentials NEVER live in this repo; the env_file directive in
  docker-compose.yml loads them from the .env on your Umbrel.


  OPTIONAL — MyAnonaMouse seeding: if you use MAM, add
  MAM_ID=<dynamic-seedbox session id> to the .env. The bundled mam-seedbox
  sidecar then re-authorizes your iVPN exit IP on MAM every 30 min (via the
  Dynamic Seedbox API) so seeding survives IP rotations. Leave MAM_ID blank
  if you do not use MAM.
developer: Transmission Project + qmcgaw (gluetun)
website: https://transmissionbt.com
submitter: brandonjamesmarshall
