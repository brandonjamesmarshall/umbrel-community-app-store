manifestVersion: 1
id: brandonjamesmarshall-transmission
name: Transmission (via iVPN)
tagline: Torrent client tunneled through iVPN
icon: https://getumbrel.github.io/umbrel-apps-gallery/transmission/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/transmission
# Suffix "+vpnN" is auto-bumped by .github/workflows/bump-version-on-compose-change.yml
# whenever the gluetun sidecar (or anything else in docker-compose.yml) updates,
# so umbrelOS shows "Update available" even when only the VPN sidecar changed.
version: "4.1.2+vpn20"
port: 9091
description: >-
  Transmission torrent client, forced through an iVPN WireGuard tunnel via
  gluetun with a built-in kill-switch. If the VPN drops, Transmission loses
  all network access.


  SETUP — pre-create the .env BEFORE clicking Install (otherwise gluetun
  can't start without a private key, and Transmission can't attach to
  gluetun's netns, which fails the whole install).

  1. Generate a WireGuard keypair locally and register the public key in
     your iVPN account area. iVPN returns your assigned tunnel address.

  2. On your Umbrel:
       sudo mkdir -p ~/umbrel/app-data/brandonjamesmarshall-transmission
       sudo nano  ~/umbrel/app-data/brandonjamesmarshall-transmission/.env
     Paste the values from .env.example in this app's folder.

  3. Click Install in umbrelOS.

  4. Verify the kill-switch — SSH the Umbrel and run:
       docker exec brandonjamesmarshall-transmission_gluetun_1 wget -qO- https://ifconfig.me
     The IP must be an iVPN IP, NOT your home IP.


  RPC AUTH: web UI defaults to user "admin" with the per-install password
  shown on this app's card in umbrelOS. Change in Edit -> Preferences in
  the web UI or by editing settings.json in the app data dir, then
  restart. Use these credentials in Sonarr/Radarr's Download Client
  config too.


  5. In the Transmission UI -> Settings, set Default Download Directory:
       /media/Download/transmission
     (matches where Sonarr/Radarr will look for completed torrents.)


  Credentials NEVER live in this repo; the env_file directive in
  docker-compose.yml loads them from the .env on your Umbrel.


  OPTIONAL — private tracker seeding: if your tracker offers a dynamic
  seedbox API, add SEEDBOX_UPDATE_URL=<endpoint URL> to the .env, plus
  SEEDBOX_COOKIE=<session cookie, name=value> if the endpoint uses cookie
  auth (use an IP-locked dynamic-seedbox session, NOT ASN-locked — VPN
  providers span multiple ASNs). The bundled seedbox-refresh sidecar then
  re-authorizes your VPN exit IP with the tracker whenever it changes, so
  seeding survives IP rotations. Leave SEEDBOX_UPDATE_URL blank if you
  don't use one.


  Trackers that require a SEMI-STABLE IP (changes less than once/hour) are
  covered: the .env pins one VPN server via a CUSTOM WireGuard endpoint
  (VPN_SERVICE_PROVIDER=custom + WIREGUARD_ENDPOINT_IP/PORT/PUBLIC_KEY), which is
  stable AND immune to gluetun's baked-in server list going stale (providers
  re-IP servers, which would otherwise dead-end a hostname pin). For seeding,
  create an IP-locked (NOT ASN-locked) dynamic-seedbox session with its
  initial IP set to your VPN exit IP; some trackers also want your VPN
  provider registered on your account profile. Full rationale and current
  server values are in .env.example.
developer: Transmission Project + qmcgaw (gluetun)
website: https://transmissionbt.com
submitter: brandonjamesmarshall
submission: https://github.com/brandonjamesmarshall/umbrel-community-app-store
repo: https://github.com/linuxserver/docker-transmission
support: https://github.com/transmission/transmission/issues
gallery:
  - https://getumbrel.github.io/umbrel-apps-gallery/transmission/icon.svg
releaseNotes: >-
  The dynamic-seedbox sidecar is now tracker-agnostic — it no longer
  hardcodes any tracker. Configure it in
  ~/umbrel/app-data/brandonjamesmarshall-transmission/.env with
  SEEDBOX_UPDATE_URL (your tracker's dynamic-seedbox endpoint) and
  SEEDBOX_COOKIE (the dedicated session's cookie as name=value).
  MIGRATION: the previous tracker-specific session-ID variable is no longer
  read — add the two new variables and restart the app. Until you do, the
  sidecar idles harmlessly; your exit IP stays pinned via the custom
  WireGuard endpoint, so seeding keeps working. Everything else is
  unchanged.
dependencies: []
path: ""
defaultUsername: "admin"
defaultPassword: ""
deterministicPassword: true
