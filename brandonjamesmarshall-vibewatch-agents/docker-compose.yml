version: "3.7"

# Vibewatch agent host — resident Buzz agents via headless Claude Code.
# Image built from github.com/Vibewatch-io/vibewatch-agents/agent-host.
# Install-first: env-init (root) generates ${APP_DATA_DIR}/.env with CHANGE_ME
# placeholders and pre-owns the data dir for the uid-1000 host process; the
# host crash-loops harmlessly until the two secrets are filled and the app is
# stopped/started. See README.md in this folder for the setup steps.

services:

  env-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    entrypoint: >
      /bin/sh -euc '
        mkdir -p /appdata/data;
        chown -R 1000:1000 /appdata/data;
        if [ ! -f /appdata/.env ]; then
          umask 077;
          {
            echo "# Generated by the agent-host app on first start.";
            echo "# Fill both CHANGE_ME values (see README in the app folder), then";
            echo "# Stop and Start the app in umbrelOS.";
            echo "";
            echo "# From: claude setup-token (on your computer; expires yearly)";
            echo "CLAUDE_CODE_OAUTH_TOKEN=CHANGE_ME";
            echo "";
            echo "# From: Buzz desktop app -> create agent \"Echo\" -> copy its nsec";
            echo "BUZZ_NSEC_ECHO=CHANGE_ME";
            echo "";
            echo "# Relay on this same Umbrel (Buzz app publishes host port 3777).";
            echo "BUZZ_RELAY_URL=http://host.docker.internal:3777";
            echo "";
            echo "# Repo identities are config, not image contents: the brain repo";
            echo "# (roster + briefs) and the extra repos the agents read.";
            echo "BRAIN_REPO=Vibewatch-io/vibewatch-agents";
            echo "SIBLING_REPOS=Vibewatch-io/vibewatch-docs Vibewatch-io/vibewatch-marketing Vibewatch-io/vibewatch-content";
            echo "";
            echo "# GitHub read token used to clone the repos above. Without it the";
            echo "# host runs the baked echo-only fallback (fine for the smoke test).";
            echo "# GH_TOKEN=";
          } > /appdata/.env;
          chown 1000:1000 /appdata/.env;
          echo "env-init: wrote fresh /appdata/.env — fill both CHANGE_ME values, then Stop/Start the app.";
        else
          echo "env-init: .env already exists, leaving it untouched.";
        fi
      '
    volumes:
      - ${APP_DATA_DIR}:/appdata
    restart: "no"

  host:
    # Digest-pinned; bump via a reviewed commit when a new image publishes
    # (the vibewatch-agents repo's CI builds on every main merge).
    image: ghcr.io/vibewatch-io/vibewatch-agent-host:sha-e98943f691f6274df0c36e335c38ca3f03ad23d7@sha256:cabc8e88b4d7695241fae08bf7c59e996e6674b277be4fc4c3440cb1e11397db
    restart: unless-stopped
    env_file:
      - path: ${APP_DATA_DIR}/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      env-init:
        condition: service_completed_successfully
