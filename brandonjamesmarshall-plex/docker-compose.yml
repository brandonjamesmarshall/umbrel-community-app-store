version: "3.7"

# Plex uses network_mode: host (matches official Umbrel) so DLNA/UPnP and
# direct LAN clients work without extra port-forward gymnastics.
# umbrelOS auto-injects /dev/dri when permissions: [GPU] is set in
# umbrel-app.yml and the host has a Intel/AMD/NVIDIA GPU device node.
#
# Media library: mounted as an NFS volume managed by Docker itself. NAS_HOST
# is set in ~/umbrel/app-data/brandonjamesmarshall-plex/.env (see
# nas.env.example). Survives umbrelOS firmware updates because the compose
# file + .env both live on the /data partition.

services:

  server:
    # Pinned to immutable digest. Renovate refreshes this after a 14-day delay.
    image: lscr.io/linuxserver/plex:1.43.2@sha256:626eb0d52b4522db3be91110a89161be6ccffc0741e9abf0e93aaf4fea98ccb9
    restart: on-failure
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      VERSION: "docker"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/transcode:/transcode
      - media:/data

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST},nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
