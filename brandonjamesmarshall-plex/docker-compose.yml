version: "3.7"

# Plex uses network_mode: host (matches official Umbrel) so DLNA/UPnP and
# direct LAN clients work without extra port-forward gymnastics.
# umbrelOS auto-injects /dev/dri when permissions: [GPU] is set in
# umbrel-app.yml and the host has a Intel/AMD/NVIDIA GPU device node.
#
# Media library: Docker-managed NFS volume backed by the NAS share.
# Mount lives in container at /media (matches the migrated Plex DB's
# library paths). Survives umbrelOS reboots/firmware-updates because
# the in-kernel NFS module is part of the firmware — no apt packages
# or host fstab entries to maintain.

services:

  server:
    # Pinned to immutable digest. Renovate refreshes this after a 14-day delay.
    # Pulled from Docker Hub, NOT lscr.io: Mend's hosted Renovate fails tag
    # lookup for lscr.io/linuxserver/plex specifically ("no-result"), which
    # silently disabled every Plex update PR. Same image and digests on both
    # registries; the docker.io lookup path is the one umbrel-app.yml's
    # version comment already uses, and it works.
    image: linuxserver/plex:1.43.3@sha256:7f9a1d574958fc2f177c14ca190d4b811a58c274477f5bae8fb44ee676fb96bf
    restart: on-failure
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      VERSION: "docker"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/transcode:/tmp
      - media:/media

volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.50.111,nfsvers=4.1,rw,hard,noatime"
      device: ":/volume3/Plex Media"
