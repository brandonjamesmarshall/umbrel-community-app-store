manifestVersion: 1
id: brandonjamesmarshall-plex
name: Plex
tagline: Stream your media library, anywhere
icon: https://getumbrel.github.io/umbrel-apps-gallery/plex/icon.svg
category: Media
# renovate: datasource=docker depName=linuxserver/plex
version: "1.43.3+nfs4"
# Not 32400: umbrelOS intercepts the manifest port. See docker-compose.yml.
port: 32499
description: >-
  Plex Media Server, packaged for this Umbrel community store with:


  - Hardware-accelerated transcoding via the Intel N100 iGPU on the Umbrel
    Home 2024 (umbrelOS auto-injects /dev/dri when the GPU permission below
    is granted). Requires Plex Pass.

  - Media library mounted from your NAS via NFS at /data, sharing
    one mount point with Sonarr, Radarr, SABnzbd, and Transmission so
    Sonarr/Radarr can hardlink imports instead of copying.


  POST-INSTALL (only if starting fresh; skip step 3 if migrating from a NAS):

  1. Sign in to plex.tv and claim this server.

  2. In Settings -> Transcoder, enable "Use hardware acceleration when
     available" and "Use hardware-accelerated video encoding".

  3. Add libraries pointing at /media/Movies, /media/TV (and optionally
     /media/Music, /media/Books, /media/Photos).


  Media library is mounted at /media via a Docker-managed NFS volume
  pointing at the NAS share — no host fstab needed, survives
  umbrelOS reboots and firmware updates.


  BACKUPS: Umbrel backups keep the Plex database and preferences (libraries,
  watch history, matches) but skip rebuildable data: artwork/metadata,
  video preview thumbnails, caches, logs, codecs and drivers. After a
  restore, run Refresh All Metadata on each library to re-download artwork;
  preview thumbnails regenerate during scheduled maintenance. Custom
  uploaded posters are not kept.
developer: Plex, Inc.
website: https://www.plex.tv
submitter: brandonjamesmarshall
submission: https://github.com/brandonjamesmarshall/umbrel-community-app-store
repo: https://github.com/linuxserver/docker-plex
support: https://forums.plex.tv
gallery:
  - https://getumbrel.github.io/umbrel-apps-gallery/plex/icon.svg
releaseNotes: >-
  Auto-updated to the latest LinuxServer Plex release. See what changed:
  https://github.com/linuxserver/docker-plex/releases
dependencies: []
permissions:
  - GPU
backupIgnore:
  - data/transcode/*
  - data/config/Library/Application*Support/Plex*Media*Server/Cache/*
  - data/config/Library/Application*Support/Plex*Media*Server/Codecs/*
  - data/config/Library/Application*Support/Plex*Media*Server/Crash*Reports/*
  - data/config/Library/Application*Support/Plex*Media*Server/Diagnostics/*
  - data/config/Library/Application*Support/Plex*Media*Server/Drivers/*
  - data/config/Library/Application*Support/Plex*Media*Server/Logs/*
  - data/config/Library/Application*Support/Plex*Media*Server/Media/*
  - data/config/Library/Application*Support/Plex*Media*Server/Metadata/*
  - data/config/Library/Application*Support/Plex*Media*Server/Plug-in*Support/Caches/*
  - data/config/Library/Application*Support/Plex*Media*Server/Updates/*
path: ""
defaultUsername: ""
defaultPassword: ""
